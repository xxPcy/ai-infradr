[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infradr"
version = "0.1.0"
description = "Diagnose PyTorch, CUDA, NVIDIA GPU, and NCCL environment problems with evidence-based checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xxPcy" }]
keywords = ["pytorch", "cuda", "nccl", "gpu", "diagnostics", "mlops", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build>=1.2",
  "twine>=5.1",
]

[project.scripts]
ai-infradr = "ai_infradr.cli.main:main"

[project.urls]
Homepage = "https://github.com/xxPcy/ai-infradr"
Issues = "https://github.com/xxPcy/ai-infradr/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_infradr.rules" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
